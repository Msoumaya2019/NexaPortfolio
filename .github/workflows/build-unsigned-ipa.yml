name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: chmod +x scripts/build-unsigned-ipa.sh && scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexaPortfolio-unsigned
          path: build/NexaPortfolio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
